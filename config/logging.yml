# Logging Configuration for VMP
# Structured logging with JSON format for production

version: 1
disable_existing_loggers: false

formatters:
  default:
    format: '[%(asctime)s] %(levelname)s in %(module)s: %(message)s'
    datefmt: '%Y-%m-%d %H:%M:%S'

  detailed:
    format: '[%(asctime)s] %(levelname)s [%(name)s.%(funcName)s:%(lineno)d] %(message)s'
    datefmt: '%Y-%m-%d %H:%M:%S'

  json:
    class: pythonjsonlogger.jsonlogger.JsonFormatter
    format: '%(asctime)s %(name)s %(levelname)s %(message)s'
    datefmt: '%Y-%m-%d %H:%M:%S'

filters:
  rate_limit:
    (): src.utils.logging_filters.RateLimitFilter
    rate: 10  # messages per second

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: detailed
    stream: ext://sys.stdout

  file:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: detailed
    filename: logs/vmp.log
    maxBytes: 10485760  # 10MB
    backupCount: 5
    encoding: utf8

  error_file:
    class: logging.handlers.RotatingFileHandler
    level: ERROR
    formatter: detailed
    filename: logs/vmp-errors.log
    maxBytes: 10485760  # 10MB
    backupCount: 10
    encoding: utf8

  json_file:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: json
    filename: logs/vmp-json.log
    maxBytes: 10485760  # 10MB
    backupCount: 5
    encoding: utf8

  security_file:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: detailed
    filename: logs/vmp-security.log
    maxBytes: 10485760  # 10MB
    backupCount: 20  # Keep more security logs
    encoding: utf8

  audit_file:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: detailed
    filename: logs/vmp-audit.log
    maxBytes: 10485760  # 10MB
    backupCount: 30  # Keep audit logs longer
    encoding: utf8

  celery_file:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: detailed
    filename: logs/celery.log
    maxBytes: 10485760  # 10MB
    backupCount: 5
    encoding: utf8

loggers:
  # Root logger
  '':
    level: INFO
    handlers: [console, file, json_file]
    propagate: false

  # VMP Application
  src:
    level: DEBUG
    handlers: [console, file, error_file]
    propagate: false

  # API requests
  src.api:
    level: INFO
    handlers: [console, file]
    propagate: false

  # Database operations
  src.database:
    level: INFO
    handlers: [file]
    propagate: false

  # Scanner operations
  src.scanner:
    level: INFO
    handlers: [console, file]
    propagate: false

  # Risk scoring
  src.prioritisation:
    level: DEBUG
    handlers: [file]
    propagate: false

  # Celery tasks
  src.workflow:
    level: INFO
    handlers: [celery_file, console]
    propagate: false

  # Security events
  security:
    level: INFO
    handlers: [security_file, console]
    propagate: false

  # Audit trail
  audit:
    level: INFO
    handlers: [audit_file]
    propagate: false

  # Third-party libraries
  sqlalchemy.engine:
    level: WARNING
    handlers: [file]
    propagate: false

  uvicorn:
    level: INFO
    handlers: [console, file]
    propagate: false

  uvicorn.access:
    level: INFO
    handlers: [file]
    propagate: false

  celery:
    level: INFO
    handlers: [celery_file]
    propagate: false

  celery.worker:
    level: INFO
    handlers: [celery_file]
    propagate: false

  celery.beat:
    level: INFO
    handlers: [celery_file]
    propagate: false

root:
  level: INFO
  handlers: [console, file]
